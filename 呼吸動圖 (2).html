<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>呼吸動圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: a large preview stage on the left with the breath controls beside it; stacks to one column on phones. */
:root {
  --bg: #E8EEF0;
  --panel: #F6F9FA;
  --ink: #102329;
  --muted: #566A71;
  --line: #C6D4D9;
  --accent: #CF3359;
  --accent-ink: #FFFFFF;
  --chk-a: #DAE4E7;
  --chk-b: #E8EEF0;
  --halo: rgba(255,255,255,.85);
  --hair: #1B8197;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E181C; --panel: #142126; --ink: #E4EEF1; --muted: #8FA5AC; --line: #27393F;
    --accent: #F0708F; --accent-ink: #1B0A10; --chk-a: #172830; --chk-b: #122027; --halo: rgba(0,0,0,.55); --hair: #5CC8DE;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E181C; --panel: #142126; --ink: #E4EEF1; --muted: #8FA5AC; --line: #27393F;
  --accent: #F0708F; --accent-ink: #1B0A10; --chk-a: #172830; --chk-b: #122027; --halo: rgba(0,0,0,.55); --hair: #5CC8DE;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top h1 {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(30px, 6vw, 46px);
  line-height: 1.15;
  letter-spacing: .04em;
  margin: 0 0 8px;
  text-wrap: balance;
}
.top p { margin: 0; max-width: 40em; color: var(--muted); text-wrap: pretty; }

.layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.stage-col, .panel { min-width: 0; }
.stage-col { display: flex; flex-direction: column; gap: 12px; }

.stage {
  position: relative;
  display: grid; place-items: center;
  padding: 20px;
  min-height: 260px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background-color: var(--chk-b);
  background-image: conic-gradient(var(--chk-a) 25%, transparent 0 50%, var(--chk-a) 0 75%, transparent 0);
  background-size: 22px 22px;
}
.stage.over { outline: 2px dashed var(--accent); outline-offset: -6px; }
.frame {
  position: relative;
  width: min(100%, calc(62vh * var(--ar, 1)));
  max-width: 100%;
  aspect-ratio: var(--ar, 1);
  touch-action: none;
  cursor: crosshair;
  user-select: none;
}
.frame canvas { display: block; width: 100%; height: 100%; }
.ring {
  position: absolute;
  aspect-ratio: 1;
  border: 2px solid var(--accent);
  box-shadow: 0 0 0 1px var(--halo), inset 0 0 0 1px var(--halo);
  border-radius: 50%;
  pointer-events: none;
  will-change: transform;
}
.ring i { position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 1.5px var(--halo); }
.hmark { position: absolute; border: 2px dashed var(--hair); border-top: 2px solid var(--hair); border-radius: 0 0 45% 45% / 0 0 30% 30%; box-shadow: 0 0 0 1px var(--halo); pointer-events: none; }
.hmark i { position: absolute; left: 50%; top: 0; width: 9px; height: 9px; margin: -5px 0 0 -4.5px; border-radius: 50%; background: var(--hair); box-shadow: 0 0 0 1.5px var(--halo); }
.sub { margin: 0; padding-top: 14px; border-top: 1px dashed var(--line); font-weight: 700; font-size: 13px; color: var(--hair); letter-spacing: .08em; }
.hmark.sel, .ring.sel { border-width: 3px; }
.tag {
  position: absolute; left: 10px; top: 10px;
  font: 500 11px/1 var(--font-mono); letter-spacing: .08em;
  padding: 5px 7px; border-radius: 4px;
  background: var(--panel); color: var(--muted); border: 1px solid var(--line);
}

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.bar .hint { color: var(--muted); font-size: 13px; flex: 1 1 14em; min-width: 0; }
.btn {
  font: 500 14px/1 var(--font-body);
  color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 10px 14px; cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .55; cursor: progress; }
.btn.block { width: 100%; padding: 14px 16px; font-size: 15px; }

.meter { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 12px 14px 10px; }
.meter svg { display: block; width: 100%; height: auto; }
.meter .base { stroke: var(--line); stroke-width: 1; }
.meter .inh, .meter .exh { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.meter .inh { stroke: var(--accent); }
.meter .exh { stroke: var(--muted); }
.meter .dot { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
.meter-row { display: flex; justify-content: space-between; gap: 12px; font: 400 12px/1.4 var(--font-mono); color: var(--muted); margin-top: 6px; letter-spacing: .04em; }
.meter-row b { color: var(--ink); font-weight: 500; }

.panel { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 18px 18px; }
.group { display: flex; flex-direction: column; gap: 14px; padding: 16px 0; border-top: 1px solid var(--line); }
.group:first-child { border-top: 0; }
.group h2 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .16em; color: var(--muted); }
.ctl { display: flex; flex-direction: column; gap: 4px; }
.ctl .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.ctl label, .ctl .lbl { font-weight: 500; }
.ctl output { font: 500 13px/1 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.ctl small { color: var(--muted); font-size: 12px; }
input[type=range] { width: 100%; accent-color: var(--accent); margin: 2px 0; }
select, input[type=color] {
  font: 400 14px/1.2 var(--font-body); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0; max-width: 100%;
}
input[type=color] { padding: 2px; width: 44px; height: 36px; cursor: pointer; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--bg); }
.seg label { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; inset: 0; }
.seg span { display: block; padding: 8px 14px; font-size: 14px; }
.seg input:checked + span { background: var(--ink); color: var(--bg); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
.seg input:disabled + span { opacity: .45; }
.bgrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.est { font: 400 12px/1.4 var(--font-mono); color: var(--muted); letter-spacing: .03em; }

.progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); }
.status { font-size: 13px; color: var(--muted); min-height: 1.4em; }

.result { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); }
.result figure { margin: 0; display: grid; place-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 8px;
  background-color: var(--chk-b); background-image: conic-gradient(var(--chk-a) 25%, transparent 0 50%, var(--chk-a) 0 75%, transparent 0); background-size: 18px 18px; }
.result img { display: block; max-width: 100%; max-height: 320px; height: auto; width: auto; }
.result .meta { font: 400 12px/1.4 var(--font-mono); color: var(--muted); letter-spacing: .03em; }
.result .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.result a.btn { text-decoration: none; display: inline-block; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .frame { width: min(100%, calc(52vh * var(--ar, 1))); }
}
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>

<main class="wrap">
  <header class="top">
    <h1>呼吸動圖</h1>
    <p>放入一張角色圖，胸口會跟著呼吸起伏、頭髮跟著輕輕飄動，再輸出成會一直循環的 GIF。圖片只在你的瀏覽器裡處理，不會上傳。</p>
  </header>

  <div class="layout">
    <section class="stage-col" aria-label="預覽">
      <div class="stage" id="stage">
        <span class="tag" id="sampleTag">範例圖</span>
        <div class="frame" id="frame">
          <canvas id="cv" role="img" aria-label="呼吸動畫預覽"></canvas>
          <div class="ring" id="ring"><i></i></div>
          <div class="hmark" id="hmL"><i></i></div><div class="hmark" id="hmR"><i></i></div>
        </div>
      </div>
      <div class="bar">
        <button class="btn" id="playBtn" type="button">暫停</button>
        <button class="btn" id="pickBtn" type="button">換圖片</button>
        <input type="file" id="file" accept="image/*" hidden>
        <span class="hint">拖進圖片、貼上，或按「換圖片」。先在右側選好要移動的對象（呼吸中心或髮根），再點選或拖曳畫面。</span>
      </div>
      <div class="meter" aria-hidden="true">
        <svg viewBox="0 0 300 60" id="meterSvg">
          <line class="base" x1="2" y1="54" x2="298" y2="54"></line>
          <path class="inh" id="pInh"></path>
          <path class="exh" id="pExh"></path>
          <circle class="dot" id="dot" r="5" cx="2" cy="54"></circle>
        </svg>
        <div class="meter-row"><span id="phase"><b>吸氣</b></span><span id="bpm"></span></div>
      </div>
    </section>

    <aside class="panel" aria-label="設定">
      <div class="group">
        <h2>呼吸</h2>
        <div class="ctl">
          <div class="row"><label for="amp">起伏幅度</label><output id="ampO" for="amp"></output></div>
          <input type="range" id="amp" min="1" max="12" step="0.5" value="4.5">
        </div>
        <div class="ctl">
          <div class="row"><label for="rad">影響範圍</label><output id="radO" for="rad"></output></div>
          <input type="range" id="rad" min="12" max="50" step="1" value="26">
          <small>範圍越大，整個上半身越一起動；越小只有胸口鼓起。</small>
        </div>
        <div class="ctl">
          <div class="row"><label for="per">一次呼吸</label><output id="perO" for="per"></output></div>
          <input type="range" id="per" min="1.5" max="6" step="0.1" value="3.5">
        </div>
      </div>

      <div class="group">
        <h2>頭髮</h2>
        <div class="ctl">
          <span class="lbl" id="hOnLbl">頭髮飄動</span>
          <div class="seg" role="group" aria-labelledby="hOnLbl">
            <label><input type="radio" name="hon" id="hOn" value="1" checked><span>開</span></label>
            <label><input type="radio" name="hon" id="hOff" value="0"><span>關</span></label>
          </div>
        </div>
        <h3 class="sub">左髮根</h3>
        <div class="ctl">
          <span class="lbl" id="hOnLblL">左髮根飄動</span>
          <div class="seg" role="group" aria-labelledby="hOnLblL">
            <label><input type="radio" name="honL" id="hOnL" value="1" checked><span>開</span></label>
            <label><input type="radio" name="honL" id="hOffL" value="0"><span>關</span></label>
          </div>
        </div>
        <div class="ctl">
          <div class="row"><label for="hAmpL">飄動幅度</label><output id="hAmpOL" for="hAmpL"></output></div>
          <input type="range" id="hAmpL" min="0.5" max="8" step="0.5" value="3">
        </div>
        <div class="ctl">
          <div class="row"><label for="hLenL">髮絲長度</label><output id="hLenOL" for="hLenL"></output></div>
          <input type="range" id="hLenL" min="10" max="60" step="1" value="30">
        </div>
        <div class="ctl">
          <div class="row"><label for="hWidL">髮絲寬度</label><output id="hWidOL" for="hWidL"></output></div>
          <input type="range" id="hWidL" min="4" max="25" step="1" value="9">
        </div>
        <div class="ctl">
          <label for="hKL">擺動速度</label>
          <select id="hKL">
            <option value="1">每次呼吸擺 1 下</option>
            <option value="2" selected>每次呼吸擺 2 下</option>
            <option value="3">每次呼吸擺 3 下</option>
          </select>
        </div>
        <h3 class="sub">右髮根</h3>
        <div class="ctl">
          <span class="lbl" id="hOnLblR">右髮根飄動</span>
          <div class="seg" role="group" aria-labelledby="hOnLblR">
            <label><input type="radio" name="honR" id="hOnR" value="1" checked><span>開</span></label>
            <label><input type="radio" name="honR" id="hOffR" value="0"><span>關</span></label>
          </div>
        </div>
        <div class="ctl">
          <div class="row"><label for="hAmpR">飄動幅度</label><output id="hAmpOR" for="hAmpR"></output></div>
          <input type="range" id="hAmpR" min="0.5" max="8" step="0.5" value="3">
        </div>
        <div class="ctl">
          <div class="row"><label for="hLenR">髮絲長度</label><output id="hLenOR" for="hLenR"></output></div>
          <input type="range" id="hLenR" min="10" max="60" step="1" value="30">
        </div>
        <div class="ctl">
          <div class="row"><label for="hWidR">髮絲寬度</label><output id="hWidOR" for="hWidR"></output></div>
          <input type="range" id="hWidR" min="4" max="25" step="1" value="9">
        </div>
        <div class="ctl">
          <label for="hKR">擺動速度</label>
          <select id="hKR">
            <option value="1">每次呼吸擺 1 下</option>
            <option value="2" selected>每次呼吸擺 2 下</option>
            <option value="3">每次呼吸擺 3 下</option>
          </select>
        </div>
        <div class="ctl">
          <span class="lbl" id="tgLbl">畫面點選時移動</span>
          <div class="seg" role="group" aria-labelledby="tgLbl">
            <label><input type="radio" name="tg" id="tgB" value="b" checked><span>呼吸中心</span></label>
            <label><input type="radio" name="tg" id="tgL" value="l"><span>左髮根</span></label>
            <label><input type="radio" name="tg" id="tgR" value="r"><span>右髮根</span></label>
          </div>
        </div>
      </div>

      <div class="group">
        <h2>輸出</h2>
        <div class="two">
          <div class="ctl">
            <label for="size">尺寸（長邊）</label>
            <select id="size">
              <option value="240">240 px</option>
              <option value="360" selected>360 px</option>
              <option value="480">480 px</option>
              <option value="640">640 px</option>
            </select>
          </div>
          <div class="ctl">
            <label for="fps">流暢度</label>
            <select id="fps">
              <option value="5">20 格/秒</option>
              <option value="4" selected>25 格/秒</option>
              <option value="3">33 格/秒</option>
            </select>
          </div>
        </div>
        <div class="ctl">
          <span class="lbl" id="bgLbl">背景</span>
          <div class="bgrow" role="group" aria-labelledby="bgLbl">
            <div class="seg">
              <label><input type="radio" name="bgm" id="bgT" value="t" checked><span>透明</span></label>
              <label><input type="radio" name="bgm" id="bgC" value="c"><span>純色</span></label>
            </div>
            <input type="color" id="bgc" value="#ffffff" aria-label="背景顏色">
          </div>
          <small id="bgNote"></small>
        </div>
        <div class="est" id="est"></div>
      </div>

      <div class="group">
        <button class="btn primary block" id="gen" type="button">產生 GIF</button>
        <div class="progress" id="prog" hidden><i id="progFill"></i></div>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </div>

      <div class="result" id="result" hidden>
        <figure><img id="out" alt="輸出的呼吸 GIF"></figure>
        <div class="meta" id="outMeta"></div>
        <div class="actions">
          <button class="btn primary" id="saveBtn" type="button" hidden>儲存 GIF</button>
          <a class="btn primary" id="dl" download="breathing.gif" hidden>下載 GIF</a>
          <span class="meta" id="saveNote"></span>
        </div>
      </div>
    </aside>
  </div>
</main>

    g.fillStyle = '#F7F2E8';
    g.beginPath(); g.moveTo(250, 440); g.lineTo(300, 504); g.lineTo(350, 440); g.closePath(); g.fill();

    var pal = new Uint8Array(768);
    for (var i = 0; i < palette.length && i < 256; i++) { pal[i * 3] = palette[i][0]; pal[i * 3 + 1] = palette[i][1]; pal[i * 3 + 2] = palette[i][2]; }
    var app = [0x21, 0xFF, 0x0B];
    'NETSCAPE2.0'.split('').forEach(function (ch) { app.push(ch.charCodeAt(0)); });
    app.push(0x03, 0x01, 0x00, 0x00, 0x00);
    this.parts.push(new Uint8Array(head), pal, new Uint8Array(app));
  }
  GifWriter.prototype.frame = function (idx, cs) {
    var t = this.tIdx >= 0, w = this.w, h = this.h;
    var gce = [0x21, 0xF9, 0x04, ((t ? 2 : 1) << 2) | (t ? 1 : 0), cs & 255, cs >> 8, t ? this.tIdx : 0, 0x00];
    var desc = [0x2C, 0, 0, 0, 0, w & 255, w >> 8, h & 255, h >> 8, 0x00, 8];
    var data = lzw(idx), blocks = [];
    for (var p = 0; p < data.length; p += 255) {
      var n = Math.min(255, data.length - p);
      blocks.push(n);
      for (var j = 0; j < n; j++) blocks.push(data[p + j]);
    }
    blocks.push(0);
    this.parts.push(new Uint8Array(gce), new Uint8Array(desc), new Uint8Array(blocks));
  };
  GifWriter.prototype.finish = function () {
    this.parts.push(new Uint8Array([0x3B]));
    return new Blob(this.parts, { type: 'image/gif' });
  };

  /* ---------- export ---------- */
  var tNext = function () { return new Promise(function (r) { setTimeout(r, 0); }); };
  var lastBlob = null, lastUrl = null;

  async function makeGif() {
    if (S.busy || !S.src) return;
    S.busy = true;
    $('gen').disabled = true;
    $('prog').hidden = false; $('progFill').style.width = '0%';
    $('status').textContent = '準備中…';
    await tNext();
    try {
      var cs = S.cs, N = frameCount();
      var ex = prepare(S.size);
      var out = new ImageData(ex.w, ex.h), mid = new ImageData(ex.w, ex.h);
      var transparent = S.transparent && S.hasAlpha;
      var bg = hexToRgb(S.bg), P = params();
      var render = function (f, ph) {
        renderFrame(ex.data.data, mid.data, out.data, ex.w, ex.h, f, ph);
        if (!transparent) flatten(out.data, bg);
        return out.data;
      };
      var samples = [[0, 0.1], [1, 0.4], [0.5, 0.7]].map(function (a) { return new Uint8ClampedArray(render(a[0], a[1])); });
      var pal = makePalette(samples, transparent ? 255 : 256);
      var tIdx = transparent ? 255 : -1;
      var lut = new Int16Array(262144).fill(-1);
      var n = ex.w * ex.h, idx = new Uint8Array(n);
      var gif = new GifWriter(ex.w, ex.h, pal, tIdx);
      for (var fi = 0; fi < N; fi++) {
        var d = render(breath(fi / N), fi / N);
        for (var p = 0, i = 0; p < n; p++, i += 4) {
          if (transparent && d[i + 3] < 128) { idx[p] = tIdx; continue; }
          var key = ((d[i] >> 2) << 12) | ((d[i + 1] >> 2) << 6) | (d[i + 2] >> 2);
          var v = lut[key];
          if (v < 0) {
            var kr = (key >> 12) * 4 + 2, kg = ((key >> 6) & 63) * 4 + 2, kb = (key & 63) * 4 + 2, best = 1e9;
            v = 0;
            for (var q = 0; q < pal.length; q++) {
              var dr = pal[q][0] - kr, dg = pal[q][1] - kg, db = pal[q][2] - kb;
              var dd = dr * dr * 3 + dg * dg * 4 + db * db * 2;
              if (dd < best) { best = dd; v = q; }
            }
            lut[key] = v;
          }
          idx[p] = v;
        }
        gif.frame(idx, cs);
        $('progFill').style.width = ((fi + 1) / N * 100).toFixed(0) + '%';
        $('status').textContent = '編碼中 ' + (fi + 1) + ' / ' + N + ' 幀';
        await tNext();
      }
      var blob = gif.finish();
      showResult(blob, N, ex.w, ex.h);
      $('status').textContent = '完成。';
    } catch (err) {
      $('status').textContent = '產生失敗：' + (err && err.message ? err.message : '請換一張較小的圖或降低尺寸再試。');
    }
    S.busy = false;
    $('gen').disabled = false;
    $('prog').hidden = true;
  }
  function fmtSize(b) { return b > 1048576 ? (b / 1048576).toFixed(2) + ' MB' : Math.round(b / 1024) + ' KB'; }
  function showResult(blob, N, w, h) {
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastBlob = blob; lastUrl = URL.createObjectURL(blob);
    $('out').src = lastUrl;
    $('outMeta').textContent = N + ' 幀 · ' + w + '×' + h + ' px · ' + fmtSize(blob.size);
    $('result').hidden = false;
    $('saveNote').textContent = '';
    if (downloads) { $('saveBtn').hidden = false; $('dl').hidden = true; $('saveNote').textContent = ''; }
    else if (!(window.claude && window.claude.use)) { $('dl').href = lastUrl; $('dl').hidden = false; $('saveBtn').hidden = true; }
    else { $('saveBtn').hidden = true; $('saveNote').textContent = '在圖片上長按或按右鍵即可另存。'; }
  }
  $('gen').addEventListener('click', makeGif);

  var downloads = null;
  $('saveBtn').addEventListener('click', async function () {
    if (!downloads || !lastBlob) return;
    try {
      await downloads.save({ filename: 'breathing.gif', data: lastBlob });
      $('saveNote').textContent = '已交給瀏覽器儲存。';
    } catch (e) {
      $('saveNote').textContent = (e && e.code === 'declined') ? '已取消。圖片上長按或按右鍵也能另存。' : '無法直接儲存，請在圖片上長按或按右鍵另存。';
    }
  });
  (async function () {
    try { downloads = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; } catch (e) { downloads = null; }
    if (downloads && lastBlob) $('saveBtn').hidden = false;
  })();

  /* ---------- start ---------- */
  S.src = makeSample();
  refreshLabels();
  rebuildPreview();
  requestAnimationFrame(tick);
})();
</script>
